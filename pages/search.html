<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>さがす｜マイクラ コマンド ぼうけん</title>
  <link rel="icon" href="../images/guide.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../fonts/fonts.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root=".." data-kids="true" data-crumbs='[["さがす", ""]]'>
  <main id="main" class="wrap" data-yomi>
    <h1>さがす・しらべる</h1>
    <form class="search-form" role="search" onsubmit="return false">
      <label for="search-input">さがしたい ことばを いれてね（れい：てれぽーと、 tp、 あさ）</label>
      <input id="search-input" type="search" autocomplete="off" enterkeyhint="search" inputmode="search">
    </form>
    <div id="search-results" aria-live="polite"></div>
    <h2>しらべる ページ</h2>
    <div class="menu-grid" id="lookup-menu"></div>
  </main>

  <script src="../js/data.js"></script>
  <script src="../js/data-commands.js"></script>
  <script src="../js/icons.js"></script>
  <script src="../js/progress.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/parts.js"></script>
  <script src="../js/search.js"></script>
  <script>
  (function () {
    var pages = (window.SITE_DATA.pages || []).filter(function (p) { return p.menu === "lookup" && p.ready; });
    var root = document.body.getAttribute("data-root");
    document.getElementById("lookup-menu").innerHTML = pages.map(function (p) {
      return '<a class="btn ' + (p.color || "btn-diamond") + '" href="' + root + '/' + p.href + '">' + window.PixelIcon(p.icon) + '<span>' + p.title + '</span></a>';
    }).join("");
  })();
  </script>
</body>
</html>
